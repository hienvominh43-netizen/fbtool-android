
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -o fbtool_android_project.zip

      - name: Build APK
        run: gradle --no-daemon -p fbtool_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FBToolMobile-debug-apk
          path: fbtool_android/app/build/outputs/apk/debug/app-debug.apk
          
